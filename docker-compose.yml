services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: campusbite-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      # Keep the existing SQLite database on the host.
      - ./backend/campusbite.db:/app/campusbite.db
      # Mount the existing environment file read-only.
      - ./backend/.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: campusbite-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
